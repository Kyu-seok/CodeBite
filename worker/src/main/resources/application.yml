server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    web-application-type: servlet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/codebite}
    username: ${SPRING_DATASOURCE_USERNAME:codebite}
    password: ${SPRING_DATASOURCE_PASSWORD:codebite}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # submission-events has 3 partitions; one thread per partition.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: codebite-worker
      auto-offset-reset: earliest
      # A submission takes seconds to grade, so the default of 500 would blow past
      # max.poll.interval.ms whenever a backlog builds and trigger a rebalance loop.
      max-poll-records: 1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.codebite.submission.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Result events are a notification, not the record — the graded row is already committed to
      # PostgreSQL. acks=1 is enough, and a bounded timeout keeps a broker stall from backing up
      # the listener thread that is trying to grade the next submission.
      acks: "1"
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
        max.block.ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: codebite-worker
    distribution:
      percentiles-histogram:
        codebite.submissions.processing.duration: true

app:
  kafka:
    topic:
      submission: submission-events
      submission-results: submission-results
  judge0:
    url: ${JUDGE0_URL:http://192.168.219.200:2358}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:150}
    poll-timeout-ms: ${JUDGE0_POLL_TIMEOUT_MS:30000}
