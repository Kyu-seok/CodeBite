server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  messages:
    # There is no messages_en.properties: English requests must fall back to the
    # default messages.properties, not to the JVM's locale (Korean on some machines).
    fallback-to-system-locale: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # datasource wasn't there originally.
  datasource:
    url: jdbc:postgresql://localhost:5432/codebite
    username: codebite
    password: codebite
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Set explicitly rather than relying on client defaults: a submission event that is
      # lost in flight leaves its row PENDING forever, so the write must be acknowledged by
      # the full ISR. Idempotence makes the retries safe to duplicate at the broker.
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        # Bound the total time send() will spend retrying. The caller does not block on the
        # future, but an unbounded retry would hold the record in the accumulator and hide
        # the failure from the re-drive sweep.
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.in.flight.requests.per.connection: 5

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: codebite-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      submission: submission-events
      submission-admin: submission-events-admin
      submission-results: submission-results
      github-import: github-imports
    # Per-instance group: each replica forms its own single-member group so it receives every
    # result event, because only the replica holding the SSE connection can push it. A shared
    # group id here would strand clients on their polling fallback.
    sse-group-id: codebite-sse-${random.uuid}
  submission:
    sse:
      # Long enough to cover a slow grade plus EventSource reconnects, short enough that a token
      # leaked through an access log is worthless by the time anyone reads it.
      token-ttl-seconds: 180
      # Server-side cap on a stream. Comfortably beyond the p95 grade time; the client falls back
      # to polling if it trips.
      timeout-ms: 120000
    redrive:
      enabled: ${REDRIVE_ENABLED:true}
      interval-ms: 60000
      # Younger than this and the worker is probably still grading it.
      min-age-seconds: 120
      # Older than this and re-publishing has had long enough; abandon to INTERNAL_ERROR.
      max-age-seconds: 1800
      batch-size: 50
      # Shorter than interval-ms so a replica that dies holding the lock cannot stall the
      # next sweep for more than one cycle.
      lock-ttl-seconds: 50
  cache:
    enabled: true
    user-profile-ttl-seconds: 300
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
    expiration-ms: 86400000  # 24 hours
  judge0:
    url: ${JUDGE0_URL:http://localhost:2358}
    poll-interval-ms: ${JUDGE0_POLL_INTERVAL_MS:150}
    poll-timeout-ms: ${JUDGE0_POLL_TIMEOUT_MS:30000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-base-uri: ${OAUTH_REDIRECT_BASE_URI:http://localhost:5173/auth/callback}
    state-expiration-ms: 300000
  # CodeBite GitHub App for GitHub Links / Solution Commits (ADR 0003). All optional: when unset,
  # the backend still starts and the GitHub Link endpoints answer 503. Dev values come from
  # scripts/setup-github-app-dev.sh (written to infra/.env).
  github:
    app-id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_APP_CLIENT_ID:}
    client-secret: ${GITHUB_APP_CLIENT_SECRET:}
    private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
    slug: ${GITHUB_APP_SLUG:}
    # owner/name of the template GitHub's new-repository page creates the Solution Repository from
    solution-repository-template: ${GITHUB_SOLUTION_REPOSITORY_TEMPLATE:Kyu-seok/codebite-solutions-template}
    install-url: ${GITHUB_APP_INSTALL_URL:}  # defaults to https://github.com/apps/<slug>/installations/new
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    web-base-url: ${GITHUB_WEB_BASE_URL:https://github.com}
    # Import pushes to <git-base-url>/<owner>/<repo>.git with the installation token.
    git-base-url: ${GITHUB_GIT_BASE_URL:https://github.com}
    codebite-base-url: ${CODEBITE_BASE_URL:https://code-bite.com}  # links in Solution Repository READMEs
    state-expiration-ms: 900000
    commit-max-tries: ${GITHUB_COMMIT_MAX_TRIES:3}  # per Solution Commit, on transient GitHub errors
    commit-retry-backoff-ms: ${GITHUB_COMMIT_RETRY_BACKOFF_MS:1000}  # doubles before each retry
