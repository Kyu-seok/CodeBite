name: Deploy

on:
  push:
    branches: [master]
  # Manual runs roll the backend replicas without a code change, e.g. after
  # scripts/setup-github-app-prod.sh updates the server's infra/.env.
  workflow_dispatch:

jobs:
  # A squash merge of a PR whose branch already contained master has the tree the PR's CI tested,
  # so re-running the tests would only repeat them (docs/adr/0013). Any doubt, a gh error included,
  # leaves tested=false and the tests run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/tested-tree.sh "$GITHUB_SHA"; then tested=true; else tested=false; fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    needs: [gate]
    if: ${{ needs.gate.outputs.tested != 'true' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [gate, test]
    # Runs after the tests pass, or when the gate skipped them; never after a failed or cancelled run.
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    # One deploy at a time: two merges seconds apart once rolled the backend
    # concurrently and collided on replica names. Never cancel a roll midway;
    # a queued run is replaced by a newer one, whose pull includes it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          # scripts/deploy-prod.sh does the roll; it runs from the pulled checkout, so a deploy
          # always runs the script of the commit it deploys.
          script: |
            set -e
            cd ~/CodeBite
            PREV_COMMIT=$(git rev-parse HEAD)
            git pull origin master
            scripts/deploy-prod.sh "$PREV_COMMIT" "${{ github.event_name }}"

  # A failed deploy leaves production on the old code without telling anyone,
  # so push a phone notification through ntfy (topic in the NTFY_TOPIC secret).
  # Runs when the tests or the deploy fail; skipped when the secret is unset.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [gate, test, deploy]
    if: failure()
    steps:
      - name: Push a notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not set; skipping"
            exit 0
          fi
          curl -fsS \
            -H "Title: CodeBite deploy failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -H "Click: $RUN_URL" \
            -d "${SHA:0:7} ${COMMIT_TITLE%%$'\n'*}. Production may still be on the previous commit; tap for the run." \
            "https://ntfy.sh/$NTFY_TOPIC"
