name: CI

on:
  push:
    # Integration branches too: scripts/merge-ticket.sh skips its local checks on a merge whose
    # tree a ticket branch already had, trusting this run (ci_checks_pushes there).
    branches: [master, 'integration/**', 'spec/**']
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  # A PR from an integration branch (spec/**, integration/**) skips its jobs: the push trigger above
  # already runs them on the same commit, and the PR's checks list those runs (gh pr checks counts the
  # skipped ones as passing).
  backend-test:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - run: ./gradlew :common:test :backend:test

  worker-test:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - run: ./gradlew :worker:test

  frontend-check:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint -- --max-warnings 0
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  scripts-check:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the commit-subject step reads every commit since master
      - run: scripts/check-shell.sh
      # The commit-msg hook's 72-character subject limit over the commits a PR or an integration push
      # adds, since --no-verify skips the hook. Not on master: its commits are squash-merged PR titles.
      - name: Commit subjects
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('origin/master..{0}', github.sha) }}
        run: scripts/check-commit-subjects.sh "$RANGE"
      - run: scripts/run-script-tests.sh
      - run: python3 -I scripts/check-doc-references.py
      - run: python3 -I scripts/copy-walkthrough-kit.py --check
      - run: python3 -I scripts/check-tracer-helpers.py

  # Deploy skips its own tests when this run's tree was already tested (docs/adr/0013), so a red
  # master here is the only sign of two PRs that break together: push a phone notification through
  # ntfy (topic in the NTFY_TOPIC secret). Only for this workflow's own master push runs; when
  # Deploy calls this file, github.workflow is "Deploy" and Deploy's own notify-failure reports.
  # scripts/tested-tree.sh ignores this job by name, since a green run skips it; a new job a green
  # run skips needs the same there (scripts/tested-tree.test.sh reads this file and fails until then).
  notify-failure:
    runs-on: ubuntu-latest
    needs: [backend-test, worker-test, frontend-check, scripts-check]
    if: ${{ failure() && github.workflow == 'CI' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Push a notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not set; skipping"
            exit 0
          fi
          curl -fsS \
            -H "Title: CodeBite master CI failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -H "Click: $RUN_URL" \
            -d "${SHA:0:7} ${COMMIT_TITLE%%$'\n'*}. Production may be running it already; tap for the run." \
            "https://ntfy.sh/$NTFY_TOPIC"
