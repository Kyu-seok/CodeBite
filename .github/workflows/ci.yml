name: CI

on:
  push:
    # Integration branches too: scripts/merge-ticket.sh skips its local checks on a merge whose
    # tree a ticket branch already had, trusting this run (ci_checks_pushes there).
    branches: [master, 'integration/**', 'spec/**']
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  # A PR from an integration branch (spec/**, integration/**) skips its jobs: the push trigger above
  # already runs them on the same commit, and the PR's checks list those runs (gh pr checks counts the
  # skipped ones as passing).
  backend-test:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - run: ./gradlew :common:test :backend:test

  worker-test:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - run: ./gradlew :worker:test

  frontend-check:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint -- --max-warnings 0
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  scripts-check:
    if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'spec/') || startsWith(github.head_ref, 'integration/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh .claude/hooks/*.sh
      - run: scripts/run-script-tests.sh
      - run: python3 -I scripts/check-doc-references.py
      - run: python3 -I scripts/copy-walkthrough-kit.py --check
