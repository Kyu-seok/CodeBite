server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The sitemap is the backend's (it lists the published problems); robots.txt names this path.
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Fingerprinted build output: cache for a year (a new build has new names).
    # ^~ so the file-extension regex below never claims an asset; add_header in a location
    # replaces the server-level headers, so the security headers are repeated here.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Anything that looks like a file: a real 404 when it doesn't exist, not the app shell with 200.
    location /.well-known/ {
        try_files $uri =404;
    }
    location ~* ^/(?!api/).*\.(txt|xml|json|md|map|webmanifest)$ {
        try_files $uri =404;
    }

    # The shell itself must never be cached: a deploy renames every asset it references.
    location = /index.html {
        expires epoch;
    }

    # SPA fallback — every other route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
