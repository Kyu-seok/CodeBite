resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SSE result stream. Must precede the generic /api/ block — nginx prefers the longest
    # matching prefix, but keeping them adjacent makes the override obvious.
    location ~ ^/api/submissions/[0-9]+/stream$ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Without these the proxy holds events until its buffer fills, which defeats streaming.
        proxy_buffering off;
        proxy_cache off;
        # Must exceed the emitter timeout (120s) or nginx severs the connection first.
        proxy_read_timeout 150s;
        # A stream is stateful; replaying it on another replica would restart the wait.
        proxy_next_upstream off;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
