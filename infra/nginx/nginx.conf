resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # One canonical origin, https://code-bite.com. Cloudflare terminates TLS and forwards the
    # visitor's scheme in X-Forwarded-Proto; a plain-HTTP visitor or the www host gets one 301 to
    # the canonical URL, so search engines index a single copy of every page. Requests that arrive
    # without the header (local checks, the compose network) are left alone.
    if ($host = www.code-bite.com) {
        return 301 https://code-bite.com$request_uri;
    }
    if ($http_x_forwarded_proto = http) {
        return 301 https://$host$request_uri;
    }

    # Browsers ignore HSTS on plain-HTTP responses, so this only takes effect through Cloudflare.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SSE result stream. Must precede the generic /api/ block — nginx prefers the longest
    # matching prefix, but keeping them adjacent makes the override obvious.
    location ~ ^/api/submissions/[0-9]+/stream$ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Without these the proxy holds events until its buffer fills, which defeats streaming.
        proxy_buffering off;
        proxy_cache off;
        # Must exceed the emitter timeout (120s) or nginx severs the connection first.
        proxy_read_timeout 150s;
        # A stream is stateful; replaying it on another replica would restart the wait.
        proxy_next_upstream off;
    }

    # The sitemap is the backend's (it lists the published problems); robots.txt names this path.
    location = /sitemap.xml {
        set $backend http://backend:8080;
        proxy_pass $backend/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Fingerprinted build output: cache for a year (a new build has new names).
    # ^~ so the file-extension regex below never claims an asset; add_header in a location
    # replaces the server-level headers, so the security headers are repeated here.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Discovery files and anything that looks like a file: a real 404 when it doesn't exist, not
    # the app shell with 200 (crawlers would index the shell as /sitemap.xml, /llms.txt, …).
    # /api/ and /grafana/ are excluded so their proxied paths keep matching their own blocks.
    location /.well-known/ {
        try_files $uri =404;
    }
    location ~* ^/(?!api/|grafana/).*\.(txt|xml|json|md|map|webmanifest)$ {
        try_files $uri =404;
    }

    # The shell itself must never be cached: a deploy renames every asset it references.
    location = /index.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
